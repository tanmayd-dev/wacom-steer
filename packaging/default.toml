# Default configuration for wacom-steer
# Copy or symlink to ~/.config/wacom-steer/config.toml

# Device matching parameters
device_name = "Wacom"
vendor = "056a"
product = "0375"

# Steering mapping parameters
steering_mode = "absolute"
center = 0.5
half_span = 0.5
deadzone = 0.0
curve = 1.0
invert = false

# Parameters for relative steering mode
relative_turn_rate = 2.0
relative_return_rate = 3.0
relative_deadzone = 0.05

# Dynamic recenter button: "none" (default), "btn_stylus", "btn_stylus2", "btn_0", etc.
recenter_button = "none"

# Pedal / Trigger mapping parameters (Stylus Y-Axis)
pedal_mode = "split"
pedal_center = 0.5
pedal_half_span = 0.5
pedal_deadzone = 0.05
pedal_curve = 1.0
pedal_invert = false

# Pen lift behavior: "center" (default) or "hold"
lift = "center"

# Logging verbosity: "trace", "debug", "info" (default), "warn", "error"
log_level = "info"

# Dry run / probe mode: when true, inspect device but do not create virtual gamepad
dry_run = false
